name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '43 1 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            runner: ubuntu-24.04
            mode: none
          - language: swift
            runner: macos-26
            mode: manual
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Swift packages before tracing
        if: matrix.language == 'swift'
        run: |
          swift --version
          swift package resolve
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
      - name: Build Swift for CodeQL
        if: matrix.language == 'swift'
        run: swift build --disable-automatic-resolution --skip-update
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
